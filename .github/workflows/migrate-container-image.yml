name: Migrate container image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub tag to migrate
        required: true
        default: cuda12.1

permissions:
  contents: read
  packages: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image to GitHub Container Registry
        env:
          SOURCE_IMAGE: docker.io/adamwebb001/cpp-ai-sandbox:${{ inputs.tag }}
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/cpp-ai-sandbox:${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE,,}" \
            "${SOURCE_IMAGE}"
